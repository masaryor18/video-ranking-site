<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者画面</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <h1>管理者ログイン</h1>

  <!-- ログインフォーム -->
  <section id="login-section">
    <input id="admin-password" type="password" placeholder="パスワードを入力" />
    <button id="login-btn">ログイン</button>
    <p id="login-error" style="color: pink; display: none;"></p>
  </section>

  <!-- 管理者メイン -->
  <section id="admin-section" style="display: none;">
    <h2>管理者ダッシュボード</h2>

    <!-- 新規登録フォーム -->
    <form id="upload-form">
      <h3>🎬 新規コンテンツ登録</h3>
      <label>タイトル:</label>
      <input id="title" type="text" required />
      <label>リンクURL:</label>
      <input id="link_url" type="text" required />
      <label>サムネイル画像:</label>
      <input id="thumbnail" type="file" accept="image/*" required />
      <button type="submit">登録</button>
    </form>

    <!-- 並び替え -->
    <div class="tabs">
      <button id="sort-popular" class="active">人気順</button>
      <button id="sort-latest">最新順</button>
    </div>

    <!-- 一覧 -->
    <div id="video-list"></div>
  </section>

  <script src="./src/admin.js" type="module"></script>
</body>
</html>
