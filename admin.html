<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理画面</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f7f7f8; padding:24px; }
    .card { max-width:720px; margin:0 auto; background:#fff; border-radius:12px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    .row { display:flex; gap:12px; }
    label { display:block; font-size:14px; color:#444; margin-top:8px; }
    input[type="text"], input[type="url"], input[type="password"], input[type="file"] {
      width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;
    }
    button { padding:10px 14px; border:0; border-radius:8px; background:#0a66ff; color:#fff; cursor:pointer; }
    button:hover { opacity:.9; }
    .hidden { display:none; }
    .video-list { margin-top:20px; display:grid; gap:10px; }
    .video-item { display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid #eee; border-radius:8px; padding:10px; }
    .actions { display:flex; gap:8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>管理画面</h1>

    <!-- ログインパネル -->
    <section id="login-panel">
      <p>管理者パスワードを入力してください。</p>
      <div class="row">
        <input type="password" id="admin-password" placeholder="パスワード" />
        <button id="login-btn">ログイン</button>
      </div>
      <small>※このページは認証済みの管理者のみが操作できます</small>
      <hr>
    </section>

    <!-- 操作パネル -->
    <section id="app-panel" class="hidden">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <h2 style="margin:0">動画登録</h2>
        <button id="logout-btn" style="background:#777">ログアウト</button>
      </div>

      <form id="upload-form" style="margin-top:12px">
        <label>タイトル</label>
        <input type="text" id="title" required>
        <label>動画URL</label>
        <input type="url" id="link_url" required>
        <label>サムネイル画像</label>
        <input type="file" id="thumbnail" accept="image/*" required>
        <div style="margin-top:12px"><button type="submit">登録する</button></div>
      </form>

      <h3 style="margin-top:24px">登録済み動画</h3>
      <div id="video-list" class="video-list"></div>
    </section>
  </div>

  <script type="module" src="./src/admin.js"></script>
</body>
</html>
