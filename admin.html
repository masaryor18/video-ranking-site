<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面</title>
  <link rel="stylesheet" href="./src/style.css">
  <style>
    body { font-family: sans-serif; background: #fafafa; padding: 2rem; }
    h1, h2 { text-align: center; }
    #admin-section { max-width: 600px; margin: 0 auto; }
    input, button { width: 100%; padding: .5rem; margin-bottom: 1rem; }
    img { max-width: 120px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>管理者ページ</h1>

  <!-- パスワード入力セクション -->
  <div id="login-section">
    <p>管理者パスワードを入力してください：</p>
    <input type="password" id="admin-password" placeholder="パスワード">
    <button id="login-btn">ログイン</button>
    <p id="login-error" style="color:red; display:none;">パスワードが違います。</p>
  </div>

  <!-- 管理画面 -->
  <div id="admin-section" style="display:none;">
    <h2>動画を追加</h2>
    <form id="upload-form">
      <label>タイトル</label>
      <input type="text" id="title" required>

      <label>動画URL</label>
      <input type="url" id="link_url" required>

      <label>サムネイル画像</label>
      <input type="file" id="thumbnail" accept="image/*" required>

      <button type="submit">登録</button>
    </form>

    <h2>登録済み動画一覧</h2>
    <div id="video-list"></div>
  </div>

  <script type="module" src="./src/admin.js"></script>
</body>
</html>
