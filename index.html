<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- JuicyAds site verification -->
  <meta name="juicyads-site-verification" content="54e04330261fcf6d65461ff2bc00eba0">

  <title>動画ランキングサイト</title>
  <link rel="stylesheet" href="./src/style.css">

  <!-- JuicyAds loader（1回だけでOK）-->
  <script async data-cfasync="false" src="https://poweredby.jads.co/js/jads.js"></script>

  <style>
    /* PC 上部（728×90） */
    #ad-desktop-top { display: none; }
    @media (min-width: 768px) {
      #ad-desktop-top { display: block; text-align:center; margin: 0 auto; }
    }

    /* スマホ上部（300×250） */
    #ad-mobile-top { text-align:center; }
    @media (min-width: 768px) {
      #ad-mobile-top { display:none; }
    }

    /* スマホ下部（300×50固定） */
    #ad-mobile-bottom {
      display: block;
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background: #000;
      padding: 6px 0;
      z-index: 9999;
    }
    @media (min-width: 768px) {
      #ad-mobile-bottom { display:none; }
    }
  </style>
</head>


<body>

  <!-- ===============================
        🍎 PC 上部バナー（728×90）
  ================================ -->
  <div id="ad-desktop-top">
    <ins id="1105281" data-width="728" data-height="90"></ins>
    <script>(adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1105281});</script>
  </div>

  <!-- ===============================
        🍎 スマホ 上部（300×250）
  ================================ -->
  <div id="ad-mobile-top">
    <ins id="1105282" data-width="300" data-height="250"></ins>
    <script>(adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1105282});</script>
  </div>


  <!-- ===============================
         🟣 年齢確認モーダル
  ================================ -->
  <div id="age-gate" class="age-gate">
    <div class="age-gate-content">
      <h2>年齢確認</h2>
      <p>このサイトは18歳以上を対象としています。</p>
      <button id="over18">18歳以上</button>
      <button id="under18">18歳未満</button>
    </div>
  </div>


  <!-- ===============================
         🎬 ランキング本体
  ================================ -->
  <div id="main-content" style="display:none;">
    <h1>動画ランキング</h1>

    <!--（JSでバナー挿入される場所を残すなら↓）-->
    <div id="banner-ad" class="banner-ad"></div>

    <div class="tabs">
      <button id="tab-popular" class="active">人気順</button>
      <button id="tab-latest">最新</button>
    </div>

    <div id="video-list"></div>

    <div class="pagination">
      <button id="prev-btn">前へ</button>
      <span id="page-number">1</span>
      <button id="next-btn">次へ</button>
    </div>
  </div>


  <!-- ===============================
        🍎 スマホ 下部（300×50）
  ================================ -->
  <div id="ad-mobile-bottom">
    <ins id="1105283" data-width="300" data-height="50"></ins>
    <script>(adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1105283});</script>
  </div>


  <!-- ===============================
         💥 ポップアップ広告（300×250）
  ================================ -->
  <div id="popup-ad" class="popup-ad" aria-hidden="true">
    <div class="popup-ad-content">
      <button class="close-ad" aria-label="広告を閉じる">×</button>

      <!-- ここに popup_ad.js が挿入 -->
      <div id="popup-ad-slot"></div>
    </div>
  </div>


  <!-- ===============================
         🟣 メインスクリプト
  ================================ -->
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/popup_ad.js"></script>

  <!-- ===============================
         💥 PopCash（ポップアンダー）
  ================================ -->
  <script type="text/javascript">
    var uid = '497160';
    var wid = '748715';
    var pop_tag = document.createElement('script');
    pop_tag.src='//cdn.popcash.net/show.js';
    document.body.appendChild(pop_tag);
    pop_tag.onerror = function() {
      pop_tag = document.createElement('script');
      pop_tag.src='//cdn2.popcash.net/show.js';
      document.body.appendChild(pop_tag);
    };
  </script>


  <!-- ===============================
         📝 18禁判定スクリプト
  ================================ -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const path = window.location.pathname;
      if (!path.endsWith('/index.html') && path !== '/') return;

      const gate = document.getElementById('age-gate');
      const main = document.getElementById('main-content');

      const over18 = document.getElementById('over18');
      const under18 = document.getElementById('under18');

      if (over18) {
        over18.addEventListener('click', () => {
          gate.style.display = 'none';
          main.style.display = 'block';
        });
      }

      if (under18) {
        under18.addEventListener('click', () => {
          window.location.href = '/under18.html';
        });
      }
    });
  </script>


  <!-- ===============================
         📝 フッター（免責）
  ================================ -->
  <footer>
    <p>
      当サイトは18歳以上の方を対象としています。<br>
      本サイトに掲載しているリンク先のコンテンツは各運営元の責任に基づいて提供されています。
    </p>

    <div class="disclaimer">
      <h3>【免責事項】</h3>
      <p>当サイトは外部サイトの公開コンテンツを紹介するものです。</p>
      <h3>【法令遵守】</h3>
      <p>有料コンテンツの違法配信は行っていません。</p>
      <h3>【18歳未満禁止】</h3>
      <p>18歳未満の閲覧は禁止されています。</p>
    </div>
  </footer>

</body>
</html>
